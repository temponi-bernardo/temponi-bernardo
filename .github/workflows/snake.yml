name: snake

on:
  schedule:
    - cron: "0 6 * * *" # diário, 03:00 em brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ação de terceiro fixada por commit sha (v3.5.0) — evita troca silenciosa da tag
      - name: generate snake svgs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#39ff88&color_dots=#161b22,#0b3d23,#0f6b3a,#22a55a,#39ff88
            dist/snake-light.svg?color_snake=#1f8f4e&color_dots=#ebedf0,#b7e4c7,#74c69d,#2d9e5f,#1f6f43

      - name: publish to output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake-dark.svg snake-light.svg
          git commit -qm "chore: update contribution snake"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
