    .big { font-size: 44px; font-weight: 700; letter-spacing: 6px; }
    .bar { font-size: 13px; }
    .blink { animation: b 1.05s steps(1) infinite; }
    .flick { animation: f 6s linear infinite; }
    @keyframes b { 50% { opacity: 0; } }
    @keyframes f { 0%,96%,100% { opacity: 1; } 97% { opacity: .82; } 98% { opacity: 1; } 99% { opacity: .9; } }
  </style>

