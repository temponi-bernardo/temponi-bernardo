<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="t d">
  <title id="t">bernardo temponi</title>
  <desc id="d">security-focused developer: vulnerability analysis, secure development, ai-assisted engineering. computer science student at puc minas.</desc>
  <defs>
    <filter id="glow" x="-5%" y="-40%" width="110%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".35"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".65"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace; font-size: 17px; }
    .big { font-size: 44px; font-weight: 700; letter-spacing: 4px; }
    .bar { font-size: 13px; }
    .blink { animation: b 1.05s steps(1) infinite; }
    .flick { animation: f 6s linear infinite; }
    @keyframes type { from { clip-path: inset(-10px 100% -10px 0); } to { clip-path: inset(-10px -20px -10px 0); } }
    .l0 { animation: type 0.40s steps(8) 0.6s both; }
.l1 { animation: type 1.23s steps(44) 1.6s both; }
.l2 { animation: type 0.42s steps(15) 3.6s both; }
.l3 { animation: type 1.76s steps(63) 4.4s both; }
.l4 { animation: type 0.40s steps(10) 7.0s both; }
.l5 { animation: type 1.68s steps(60) 7.6s both; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @keyframes b { 50% { opacity: 0; } }
    @keyframes f { 0%,96%,100% { opacity: 1; } 97% { opacity: .82; } 98% { opacity: 1; } 99% { opacity: .9; } }
  </style>

  <rect x="1" y="1" width="898" height="318" rx="10" fill="#070b08" stroke="#1f8f4e" stroke-width="2"/>
  <g class="flick">
    <rect x="1" y="1" width="898" height="30" rx="10" fill="#0e1a12"/>
    <rect x="1" y="20" width="898" height="11" fill="#0e1a12"/>
    <line x1="1" y1="31" x2="899" y2="31" stroke="#1f8f4e" stroke-width="1.5"/>
    <text class="bar" x="20" y="21" fill="#1f8f4e">[#] tty0 :: temponi@sec-lab</text>
    <text class="bar" x="880" y="21" fill="#1f8f4e" text-anchor="end">9600 baud  -  online</text>

    <text class="big" x="40" y="96" fill="#39ff88" filter="url(#glow)">bernardo temponi</text>
    <line x1="40" y1="116" x2="860" y2="116" stroke="#1f8f4e" stroke-dasharray="6 5"/>
    
  <text class="l0" x="40" y="150" fill="#ffb000" filter="url(#glow)"><tspan fill="#1f8f4e">$ </tspan>whoami</text>
  <text class="l1" x="40" y="175" fill="#39ff88" filter="url(#glow)"><tspan fill="#1f8f4e">&gt; </tspan>security-focused developer // open to work</text>
  <text class="l2" x="40" y="205" fill="#ffb000" filter="url(#glow)"><tspan fill="#1f8f4e">$ </tspan>cat focus.txt</text>
  <text class="l3" x="40" y="230" fill="#39ff88" filter="url(#glow)"><tspan fill="#1f8f4e">&gt; </tspan>vulnerability analysis . secure dev . ai-assisted engineering</text>
  <text class="l4" x="40" y="260" fill="#ffb000" filter="url(#glow)"><tspan fill="#1f8f4e">$ </tspan>uname -a</text>
  <text class="l5" x="40" y="285" fill="#39ff88" filter="url(#glow)"><tspan fill="#1f8f4e">&gt; </tspan>cs student @ puc minas (6th sem) . belo horizonte, mg - br<tspan class="blink" fill="#39ff88"> _</tspan></text>
  </g>
  <rect x="2" y="2" width="896" height="316" rx="9" fill="url(#scan)" pointer-events="none"/>
  <rect x="2" y="2" width="896" height="316" rx="9" fill="url(#vig)" pointer-events="none"/>
</svg>
